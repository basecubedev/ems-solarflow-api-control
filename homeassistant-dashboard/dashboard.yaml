views:
  - type: sections
    max_columns: 4
    title: ems-solarflow-api-control
    path: ems-neu
    sections:
      - type: grid
        cards:
          - type: heading
            heading: ems-solarflow-api-control
            heading_style: title
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  # ⚡ EMS SolarFlow
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: sensor.ems_solarflow_solar_total
                    name: Solar
                    color: amber
                  - type: tile
                    entity: sensor.ems_solarflow_battery_power
                    name: Battery
                    color: green
                  - type: tile
                    entity: sensor.ems_solarflow_home
                    name: Home
                    color: blue
                  - type: tile
                    entity: sensor.ems_solarflow_load
                    name: Grid
                    color: red
                  - type: tile
                    entity: sensor.ems_solarflow_soc_avg
                    name: Avg SOC
                    color: teal
                  - type: tile
                    entity: sensor.ems_solarflow_target_total
                    name: Target
                    color: purple
              - type: horizontal-stack
                cards:
                  - type: entities
                    title: 🎛 EMS Control
                    show_header_toggle: false
                    entities:
                      - entity: input_boolean.ems_solarflow_enable
                        name: Enabled
                      - entity: input_number.ems_solarflow_max_power
                        name: Max Power
                      - entity: input_number.ems_solarflow_interval
                        name: Interval
                      - entity: input_number.ems_solarflow_min_output_limit
                        name: Min Output
                      - type: divider
                      - entity: sensor.ems_solarflow_load
                        name: Load
                      - entity: sensor.ems_solarflow_target_total
                        name: Target
                  - type: entities
                    title: ⚙️ Regulation
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr1_target
                        name: WR1 Target
                      - entity: sensor.ems_solarflow_wr1_output
                        name: WR1 Output
                      - type: divider
                      - entity: sensor.ems_solarflow_wr2_target
                        name: WR2 Target
                      - entity: sensor.ems_solarflow_wr2_output
                        name: WR2 Output
              - type: horizontal-stack
                cards:
                  - type: entities
                    title: 🧭 Runtime Control
                    show_header_toggle: false
                    entities:
                      - entity: input_boolean.ems_solarflow_wr1_enabled
                        name: WR1 Enabled
                      - entity: input_number.ems_solarflow_wr1_max_power
                        name: WR1 Max Power
                      - entity: input_boolean.ems_solarflow_wr1_offgrid_socket
                        name: WR1 Offgrid Socket
                      - type: divider
                      - entity: input_boolean.ems_solarflow_wr2_enabled
                        name: WR2 Enabled
                      - entity: input_number.ems_solarflow_wr2_max_power
                        name: WR2 Max Power
                      - entity: input_boolean.ems_solarflow_wr2_offgrid_socket
                        name: WR2 Offgrid Socket
                  - type: entities
                    title: ❄️ Winter Mode
                    show_header_toggle: false
                    entities:
                      - entity: binary_sensor.ems_solarflow_winter_enabled
                        name: Enabled
                      - entity: binary_sensor.ems_solarflow_winter_active
                        name: Active
                      - entity: binary_sensor.ems_solarflow_winter_adjust_window
                        name: Adjust Window
                      - type: divider
                      - entity: sensor.ems_solarflow_winter_summer_min_soc
                        name: Summer minSoc
                      - entity: sensor.ems_solarflow_winter_min_soc
                        name: Winter minSoc
                      - entity: sensor.ems_solarflow_winter_ramp_step
                        name: Ramp Step
                      - entity: sensor.ems_solarflow_winter_ac_charge_power
                        name: AC Charge Limit
                      - entity: sensor.ems_solarflow_winter_last_adjust_date
                        name: Last Adjust
              - type: horizontal-stack
                cards:
                  - type: entities
                    title: 🔋 WR1 Battery
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr1_soc
                        name: SOC
                      - entity: sensor.ems_solarflow_wr1_min_soc
                        name: minSoc
                      - entity: sensor.ems_solarflow_wr1_max_soc
                        name: maxSoc
                      - entity: sensor.ems_solarflow_wr1_winter_min_soc_target
                        name: Winter minSoc Target
                      - entity: sensor.ems_solarflow_wr1_winter_estimated_ramp_days
                        name: Winter Ramp Days
                      - type: divider
                      - entity: sensor.ems_solarflow_wr1_voltage
                        name: Voltage
                      - entity: sensor.ems_solarflow_wr1_temp
                        name: Temp
                      - entity: sensor.ems_solarflow_wr1_remaining_time
                        name: Remaining time
                      - type: divider
                      - entity: sensor.ems_solarflow_wr1_battery_power
                        name: Battery power
                      - entity: sensor.ems_solarflow_wr1_battery_power_avg
                        name: Battery power avg
                  - type: entities
                    title: 🔋 WR2 Battery
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr2_soc
                        name: SOC
                      - entity: sensor.ems_solarflow_wr2_min_soc
                        name: minSoc
                      - entity: sensor.ems_solarflow_wr2_max_soc
                        name: maxSoc
                      - entity: sensor.ems_solarflow_wr2_winter_min_soc_target
                        name: Winter minSoc Target
                      - entity: sensor.ems_solarflow_wr2_winter_estimated_ramp_days
                        name: Winter Ramp Days
                      - type: divider
                      - entity: sensor.ems_solarflow_wr2_voltage
                        name: Voltage
                      - entity: sensor.ems_solarflow_wr2_temp
                        name: Temp
                      - entity: sensor.ems_solarflow_wr2_remaining_time
                        name: Remaining time
                      - type: divider
                      - entity: sensor.ems_solarflow_wr2_battery_power
                        name: Battery power
                      - entity: sensor.ems_solarflow_wr2_battery_power_avg
                        name: Battery power avg
              - type: horizontal-stack
                cards:
                  - type: entities
                    title: ☀️ WR1 PV
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr1_panel1
                        name: Panel 1
                      - entity: sensor.ems_solarflow_wr1_panel2
                        name: Panel 2
                      - entity: sensor.ems_solarflow_wr1_panel3
                        name: Panel 3
                      - entity: sensor.ems_solarflow_wr1_panel4
                        name: Panel 4
                      - type: divider
                      - entity: sensor.ems_solarflow_wr1_solar
                        name: Total
                  - type: entities
                    title: ☀️ WR2 PV
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr2_panel1
                        name: Panel 1
                      - entity: sensor.ems_solarflow_wr2_panel2
                        name: Panel 2
                      - entity: sensor.ems_solarflow_wr2_panel3
                        name: Panel 3
                      - entity: sensor.ems_solarflow_wr2_panel4
                        name: Panel 4
                      - type: divider
                      - entity: sensor.ems_solarflow_wr2_solar
                        name: Total
              - type: horizontal-stack
                cards:
                  - type: entities
                    title: 🩺 WR1 Runtime Status
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr1_rssi
                        name: RSSI
                      - entity: binary_sensor.wr1_fault
                        name: Fault
                      - entity: sensor.ems_solarflow_wr1_fault_level
                        name: FaultLevel signal
                      - entity: sensor.ems_solarflow_wr1_output_limit
                        name: Output Limit
                      - entity: sensor.ems_solarflow_wr1_soc_limit
                        name: SOC Limit
                      - entity: sensor.ems_solarflow_wr1_pack_state
                        name: Pack State
                      - type: divider
                      - entity: binary_sensor.wr1_ac_active
                        name: AC path
                      - entity: binary_sensor.wr1_dc_active
                        name: DC path
                      - entity: binary_sensor.wr1_grid_online
                        name: Grid online
                  - type: entities
                    title: 🩺 WR2 Runtime Status
                    show_header_toggle: false
                    entities:
                      - entity: sensor.ems_solarflow_wr2_rssi
                        name: RSSI
                      - entity: binary_sensor.wr2_fault
                        name: Fault
                      - entity: sensor.ems_solarflow_wr2_fault_level
                        name: FaultLevel signal
                      - entity: sensor.ems_solarflow_wr2_output_limit
                        name: Output Limit
                      - entity: sensor.ems_solarflow_wr2_soc_limit
                        name: SOC Limit
                      - entity: sensor.ems_solarflow_wr2_pack_state
                        name: Pack State
                      - type: divider
                      - entity: binary_sensor.wr2_ac_active
                        name: AC path
                      - entity: binary_sensor.wr2_dc_active
                        name: DC path
                      - entity: binary_sensor.wr2_grid_online
                        name: Grid online
            grid_options:
              columns: 24
              rows: auto
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: ems-solarflow-api-control - Flow
            heading_style: title
          - type: custom:power-flow-card-plus
            entities:
              battery:
                invert_state: true
                color_value: false
                entity: sensor.ems_solarflow_battery_power
              grid:
                entity: sensor.ems_solarflow_load
                color:
                  consumption:
                    - 203
                    - 93
                    - 234
                  production:
                    - 203
                    - 93
                    - 234
                color_value: false
                display_zero: true
              solar:
                entity: sensor.ems_solarflow_solar_total
                display_zero_state: true
                display_zero: true
                color_value: false
                color_icon: false
                use_metadata: false
              home:
                entity: sensor.ems_solarflow_home
                subtract_individual: false
                use_metadata: false
                override_state: false
                secondary_info:
                  color_value: false
                  accept_negative: false
                  decimals: 0
                  unit_white_space: true
                hide: false
                name: Bedarf
              fossil_fuel_percentage:
                color:
                  - 33
                  - 80
                  - 140
              individual: []
            clickable_entities: true
            display_zero_lines:
              mode: transparency
              transparency: 70
              grey_color:
                - 189
                - 189
                - 189
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            mega_threshold: 1000000
            transparency_zero_lines: 0
            sort_individual_devices: true
            disable_dots: false
            allow_layout_break: false
        column_span: 1
    cards: []
