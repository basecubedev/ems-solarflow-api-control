services:
  ems-solarflow:
    # latest tracks main and is rebuilt weekly.
    # For stable deployments, pin a release tag such as v0.5.6.
    image: ghcr.io/basecubedev/ems-solarflow-api-control:latest
    container_name: ems-solarflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config/config.json:ro
      - ./data:/app/data
