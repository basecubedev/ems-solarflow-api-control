version = 1

[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.png",
  "**/*.jpg",
  "**/*.gif",
  "**/*.mp4",
  "**/*.webm",
  "**/.gitkeep",
  ".gitnexusrc",
  "docs/assets/**",
  "reports/**",
  "tests/fixtures/**",
  "packaging/appliance/debian/control",
  "packaging/appliance/debian/conffiles",
  "packaging/appliance/config/release-keyring.gpg",
  "packaging/appliance/config/rescue-password.hash",
  "packaging/appliance/image/rpi-image-gen.lock",
  "packaging/appliance/image/layer/ems-appliance.yaml",
]
SPDX-FileCopyrightText = "2026 basecubedev"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  "dashboard/static/modern/assets/modern.js",
  "appliance/static/modern/assets/appliance.js",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 basecubedev",
  "2016-2025 Svelte Contributors",
  "Luke Edwards",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

[[annotations]]
path = ["admin/static/modern/assets/vendor.js", "*/static/modern/licenses.json"]
precedence = "override"
SPDX-FileCopyrightText = ["2016-2025 Svelte Contributors", "Luke Edwards"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "*/static/modern/assets/*.css"
precedence = "override"
SPDX-FileCopyrightText = ["2026 basecubedev", "2016 The Inter Project Authors"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND OFL-1.1"

[[annotations]]
path = ["*/static/modern/assets/*.woff2", "*/static/modern/Inter.LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "*/static/modern/Vite.LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2019-present VoidZero Inc. and Vite contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "*/static/modern/Lucide.LICENSE"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

[[annotations]]
path = "*/static/modern/index.html"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

[[annotations]]
path = "admin/static/modern/assets/admin.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-present VoidZero Inc. and Vite contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["dashboard/static/uPlot.iife.min.js", "dashboard/static/uPlot.min.css", "dashboard/static/uPlot.LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2022 Leon Sorokin"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "tests/fixtures/rpi_image_gen/**"
precedence = "override"
SPDX-FileCopyrightText = "2015-2024 Raspberry Pi (Trading) Ltd."
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "tests/fixtures/rpi_image_gen/source-manifest.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 basecubedev"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "third_party/influx-cli/**"
precedence = "override"
SPDX-FileCopyrightText = "2021 InfluxData"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/docker-cli/**"
precedence = "override"
SPDX-FileCopyrightText = "2012-2017 Docker, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "third_party/docker-cli/MUSL.COPYRIGHT"
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/docker-compose/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 Docker Compose authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "third_party/*/THIRD_PARTY_NOTICES"
precedence = "override"
SPDX-FileCopyrightText = ["2026 basecubedev (the compilation)", "the authors of the modules it names (each text in it)"]
SPDX-License-Identifier = "CC0-1.0"
