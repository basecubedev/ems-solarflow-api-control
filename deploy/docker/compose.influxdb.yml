# Official optional InfluxDB 2.x backend for the EMS Analytics/History feature.
#
# InfluxDB is optional: the EMS controller and dashboard run fine without it
# (the dashboard falls back to local SQLite history). Use this only if you want
# the Analytics tab backed by InfluxDB with long-range downsampled history.
#
# Zero-config quick start (recommended):
#   # in config.json set influxdb.enabled=true (mode stays "bundled")
#   python3 emsctl.py stack up
# This generates deploy/docker/influxdb.env automatically, starts InfluxDB and
# the EMS with a shared INFLUXDB_TOKEN, and reconciles buckets/tasks.
#
# Manual equivalent:
#   python3 emsctl.py influx init      # creates influxdb.env, starts, syncs
#   python3 emsctl.py influx status
#
# All bootstrap values (DOCKER_INFLUXDB_INIT_*) and the EMS token live directly
# in influxdb.env. We intentionally do NOT use ${...} interpolation here:
# Compose variable substitution reads the shell / --env-file, not a service
# env_file, so keeping the values in env_file avoids that pitfall.
#
# IMPORTANT: env_file below is resolved relative to the *project directory*
# (the directory of the first -f compose file), so it is written repo-root
# relative. Always run this file alongside the root docker-compose.example.yml
# from the repo root, e.g.:
#   docker compose -f docker-compose.example.yml \
#     -f deploy/docker/compose.influxdb.yml \
#     -f deploy/docker/compose.ems-influx-env.yml up -d
# (emsctl.py stack up / influx init do this for you.)
#
# influxdb.env is gitignored. Never commit real tokens or passwords.
# See docs/influxdb.md for the full setup and the bucket/task sync workflow.
services:
  influxdb:
    image: influxdb:2.7
    container_name: ems-influxdb
    ports:
      - "8086:8086"
    env_file:
      - deploy/docker/influxdb.env
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

volumes:
  influxdb-data:
