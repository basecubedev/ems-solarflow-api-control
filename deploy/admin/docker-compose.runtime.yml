# SPDX-License-Identifier: AGPL-3.0-or-later
# EMS SolarFlow Admin — end-user runtime, deployment-capable (host networking).
#
# Runs the published GHCR image; no source checkout and no local build. Normal
# users get this through the installer, which writes a self-contained copy and
# fills the environment in:
#
#   sh install-admin-console.sh
#
# EMS SolarFlow is a local LAN appliance, so this default uses host networking:
# device discovery sees the real LAN and the UI is reachable on every host
# address on port 8090. For Docker bridge networking with a published port use
# docker-compose.runtime.bridge.yml instead.
#
# The Admin container controls the *host* Docker engine over the mounted
# /var/run/docker.sock (Docker-out-of-Docker); it ships only the Docker client,
# never a daemon. For the local-build developer path use docker-compose.yml.
#
# SECURITY: mounting /var/run/docker.sock grants effectively root-equivalent
# control of the host through the Docker API. Run this only on a trusted local
# machine or trusted LAN and never expose the Admin UI to the internet.
services:
  ems-solarflow-admin:
    image: ghcr.io/basecubedev/ems-solarflow-admin:${EMS_ADMIN_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    # Join the host Docker socket group so the non-root user can reach the
    # socket; the installer discovers DOCKER_GID for you.
    group_add:
      - "${DOCKER_GID:-999}"
    # Host networking: the UI binds 8090 on every host address and discovery
    # sees the real LAN. No Docker port mapping applies.
    network_mode: host
    environment:
      # Same-path mounting: point at the real host install root and Admin data
      # dir so any bind mount Admin forwards to the host Docker daemon stays a
      # valid host path.
      EMS_INSTALL_DIR: "${EMS_INSTALL_DIR}"
      EMS_ADMIN_DATA_DIR: "${EMS_ADMIN_DATA_DIR}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DOCKER_CONFIG: /tmp/docker
    volumes:
      - "${EMS_INSTALL_DIR}:${EMS_INSTALL_DIR}"
      - "${EMS_ADMIN_DATA_DIR}:${EMS_ADMIN_DATA_DIR}"
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
