# EMS SolarFlow API control — Docker-first setup.
#
# EMS only:
#   docker compose up -d
#
# EMS + Analytics (bundled InfluxDB):
#   docker compose --profile with-analytics up -d
# Compose 2.24+ is required for optional env_file entries (`required: false`).
services:
  ems:
    image: ghcr.io/basecubedev/ems-solarflow-api-control:v0.7.0
    container_name: ems-solarflow-api-control
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    environment:
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      EMS_IN_CONTAINER: "1"
    env_file:
      - path: ./config/influxdb.env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data

  influxdb:
    image: influxdb:2.7
    container_name: ems-influxdb
    profiles:
      - with-analytics
    ports:
      - "8086:8086"
    env_file:
      - path: ./config/influxdb.env
        required: false
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    restart: unless-stopped
