  "comment": [
    "The exact rpi-image-gen revision this project's appliance image is built",
    "against. Pinned rather than tracking master: image-rpios owns the partition",
    "table and the by-slot links the root is mounted through, so an upstream",
    "change to either changes what this appliance is. appliance/rpi_image_gen.py",
    "verifies a checkout against this file and refuses to build against anything",
    "else.",
    "tree_sha256 is the canonical digest of the extracted tree, excluding the",
    "source record itself. The record beside the tree is written by the same",
    "fetch that extracted it, so it cannot be the authority for it: this file",
    "is reviewed and committed, and that is what makes it one."
  ],
  "commit": "a7b6d4806183195f3efadb533f58c8e46393d057",
  "executable": "rpi-image-gen",
  "host_dependencies_file": "depends",
