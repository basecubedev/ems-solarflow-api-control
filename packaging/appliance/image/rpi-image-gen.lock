{
  "lock_version": 1,
  "comment": [
    "The exact rpi-image-gen revision this project's A/B appliance image is",
    "built against. Pinned rather than tracking master: image-rota owns the",
    "partition table, the slot identities and the shared-slot mount mechanism,",
    "so an upstream change to any of them changes what this appliance is.",
    "appliance/rpi_image_gen.py verifies a checkout against this file and",
    "refuses to build against anything else."
  ],
  "repository": "https://github.com/raspberrypi/rpi-image-gen",
  "release": "v2.7.0",
  "commit": "a7b6d4806183195f3efadb533f58c8e46393d057",
  "tarball": {
    "comment": [
      "The second supported source form. A tarball has no .git, so it proves",
      "itself by this digest instead: the fetch script verifies the download",
      "before extracting it and records the result beside the tree. Verified",
      "byte-identical to the pinned checkout."
    ],
    "url": "https://codeload.github.com/raspberrypi/rpi-image-gen/tar.gz/refs/tags/v2.7.0",
    "sha256": "sha256:f10e70b59ec1f1daf0089b9f62a07e8d7cee5e23574b14874da02a698ab71220",
    "top_level_directory": "rpi-image-gen-2.7.0"
  },
  "executable": "rpi-image-gen",
  "build_command": ["build", "-c", "<config>", "-S", "<srcdir>"],
  "image_layer": "image-rota",
  "image_layer_version": "5.5.1",
  "image_layer_path": "image/gpt/ab_userdata/image.yaml",
  "shared_slot_mechanism": "slot-shared",
  "shared_slot_conf_dir": "/etc/rpi-image-gen/slot-shared.d",
  "shared_slot_conf_version": "1",
  "shared_root": "/persistent/shared",
  "persistent_mountpoint": "/persistent",
  "bootconfig_mountpoint": "/bootfs",
  "boot_mountpoint": "/boot/firmware",
  "machine_id_source": "/persistent/common/etc/machine-id",
  "slot_device_prefix": "/dev/disk/by-slot",
  "update_archive": "update.tar.zst",
  "update_members": ["boot", "system"],
  "update_member_format": "android-sparse",
  "required_paths": [
    "rpi-image-gen",
    "LICENSE",
    "depends",
    "image/gpt/ab_userdata/image.yaml",
    "image/gpt/ab_userdata/post-image.sh",
    "image/gpt/ab_userdata/genimage.cfg.in.ext4",
    "image/gpt/ab_userdata/device/rootfs-overlay/usr/lib/systemd/system-generators/slot-shared-generator",
    "image/gpt/ab_userdata/device/rootfs-overlay/usr/lib/systemd/system-generators/slot-perst-generator",
    "layer/rpi/device/slot-mapper/bin/rpi-slot-label",
    "config/trixie-minbase-ab.yaml"
  ],
  "refused_paths": [
    "build.sh"
  ],
  "partition_labels": {
    "bootconfig": "bootconfig",
    "boot": ["boot_a", "boot_b"],
    "system": ["system_a", "system_b"],
    "persistent": "persistent"
  },
  "host_dependencies_file": "depends",
  "reason_codes": {
    "checkout_missing": "rpi_image_gen_unavailable",
    "contract_mismatch": "rpi_image_gen_incompatible",
    "host_dependencies": "rpi_image_gen_dependencies_missing"
  }
}
