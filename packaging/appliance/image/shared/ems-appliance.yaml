#
# Everything the appliance image is, except which board it is for.
# The hardware profiles under ../profiles/ include this file and add exactly one
# thing each: the upstream device layer.
#
# Two partitions, and image-rpios owns them -- but the sizes are stated here,
# because the root is the whole appliance: the OS, Docker, the EMS deployment,
# its data and its backups.
#
# Absolute sizes rather than upstream's 200%/300% defaults: what a percentage
# means to genimage's sizing has not been verified by this project, and a
# release's evidence has to be able to name the number. The tail of a larger
# medium is claimed on first boot instead.
#
# See ../../../../docs/appliance/adr/single-image-appliance.md.
include:
  file: trixie-minbase.yaml

device:
  hostname: ems-solarflow

# Upstream defaults to Europe/London. An appliance sold as needing no
# configuration must not inherit somebody else's clock, so the host stays on a
# deterministic UTC and the operator's zone is carried into the containers as
# TZ instead -- see `timezone` in appliance.conf.
locale:
  timezone: UTC

image:
  layer: image-rpios
  # ext4 rather than btrfs: it is what this project's inspection and its
  # hardware validation have been exercised against, and what resize2fs grows.
  rootfs_type: ext4
  boot_part_size: 256M
  root_part_size: 8G

layer:
  app: ems-appliance
