# A kernel that comes up and a userspace that then hangs looks like a successful
# boot to everything above it, and a headless appliance is then unreachable
# until somebody pulls the power.
#
# The Pi 4 and Pi 5 have a hardware watchdog. Petting it is systemd's job, and a
# userspace that stops petting it gets rebooted rather than left hanging.
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=180
