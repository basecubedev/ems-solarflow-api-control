# /etc/NetworkManager/system-connections is one of the shared paths bound from
# the persistent partition, so it holds the operator's real network profiles —
# including the credentials that make the appliance reachable at all.
#
# Upstream's slot-shared generator guards each bind with a condition and
# therefore fails open: when the persistent source is missing the bind is
# skipped, and what stays behind is the empty slot-local directory shipped in
# the image. NetworkManager starting against that would come up with no
# profiles, look healthy, and quietly write new ones into a directory the next
# slot switch discards.
#
# Requires=, not just After=: an appliance whose persistent state could not be
# proven must not bring up networking against a fallback directory. The
# verification service is the one that fails closed.
[Unit]
Requires=ems-appliance-persistence.service
After=ems-appliance-persistence.service
