# sshd reads its host keys from the persistent partition through
# /etc/ssh/sshd_config.d/50-ems-appliance-hostkeys.conf. Requires=, not just
# After=: an appliance whose key directory could not be proven must not offer
# SSH at all rather than offer it under an identity nobody can vouch for.
[Unit]
Requires=ems-appliance-host-identity.service
After=ems-appliance-host-identity.service
