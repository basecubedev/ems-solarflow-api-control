# Tryboot protects against a slot that does not boot. It does nothing for a slot
# whose kernel comes up and whose userspace then hangs: the firmware sees a
# successful boot, the health check never runs, and a headless appliance is
# unreachable until somebody pulls the power.
#
# The Pi 4 and Pi 5 have a hardware watchdog. Petting it is systemd's job, and a
# userspace that stops petting it gets the reboot the trial slot needs in order
# to fall back on its own.
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=180
