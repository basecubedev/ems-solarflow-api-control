# One authoritative ownership model for the appliance layout.
#
# The shared ems-appliance group exists for exactly one thing: reaching the
# agent socket. It is not a read grant on agent state. Everything the agent
# owns is root:root and unreadable for the web account, which gets privileged
# state through the agent API and no other way.
#
# The runtime rule must stay identical to what the agent unit creates through
# RuntimeDirectory=: root:ems-appliance 0750.
d /run/ems-appliance-manager 0750 root ems-appliance -

# Shared roots stay group-traversable so the web account can reach its own
# subtree below them. Nothing is world-traversable or world-readable.
d /var/lib/ems-appliance-manager 0750 root ems-appliance -
d /var/log/ems-appliance-manager 0750 root ems-appliance -

# Web-owned state: sessions and UI preferences. The shared password is not
# here; it lives in the EMS deployment root, which the agent owns.
d /var/lib/ems-appliance-manager/web 0750 ems-appliance-web ems-appliance -
d /var/lib/ems-appliance-manager/web/sessions 0700 ems-appliance-web ems-appliance -
d /var/lib/ems-appliance-manager/web/ui-preferences 0750 ems-appliance-web ems-appliance -
d /var/log/ems-appliance-manager/web 0750 ems-appliance-web ems-appliance -

# Agent-owned state: root only. Operation records carry confirmation tokens and
# known-good files carry the rollback identity, so neither is group-readable.
d /var/lib/ems-appliance-manager/agent 0700 root root -
d /var/lib/ems-appliance-manager/agent/operations 0700 root root -
d /var/lib/ems-appliance-manager/agent/known-good 0700 root root -
d /var/lib/ems-appliance-manager/agent/compose-backup 0700 root root -
d /var/lib/ems-appliance-manager/agent/package-state 0700 root root -
d /var/lib/ems-appliance-manager/agent/recovery 0700 root root -
d /var/lib/ems-appliance-manager/agent/ssh-keys 0700 root root -
d /var/lib/ems-appliance-manager/agent/support 0700 root root -
d /var/lib/ems-appliance-manager/agent/packages 0700 root root -
d /var/log/ems-appliance-manager/agent 0700 root root -

# The audit trail is written by the agent and is not readable, rewritable or
# removable by the web account.
d /var/log/ems-appliance-manager/audit 0700 root root -

# The SFTP export root the backup account is chrooted into. sshd refuses a
# chroot whose path is not root-owned or is writable by group or others, so
# these modes are a functional requirement. The directories below it are the
# mount points for the read-only binds of the EMS export paths.
d /srv/ems-appliance-export 0755 root root -
d /srv/ems-appliance-export/config 0755 root root -
d /srv/ems-appliance-export/backups 0755 root root -
d /srv/ems-appliance-export/data 0755 root root -
