# Container images the Appliance Manager may install.
#
# One repository per line. The browser cannot add, change or override an entry:
# a request carries a release tag, never an image reference. A pulled image is
# additionally checked against expected_source and against its OCI version
# label before it may replace a running Admin.

ghcr.io/basecubedev/ems-solarflow-admin

expected_source = https://github.com/basecubedev/ems-solarflow-api-control

# Release candidates (v1.2.3-rc1) may be installed. This project publishes more
# candidates than releases before 1.0, so an appliance that refused them would
# offer a version list with almost nothing in it.
#
# Set it to false to refuse them. The version list still shows every candidate,
# greyed out with the reason; an exact candidate tag typed in Expert mode is
# refused with prerelease_not_allowed. Either way a candidate replaces a running
# Admin through the same plan-and-confirm step a release goes through, and
# through no additional one.
allow_prerelease = true

# Tags released before the OCI labels existed. Everything else fails closed
# when a required label is missing.
legacy_exempt_tags =
