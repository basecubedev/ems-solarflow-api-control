# EMS SolarFlow Appliance Manager host configuration.
#
# Only root may edit this file. The browser can never widen any set defined
# here: container names, host accounts and supported architectures are host
# authority, not request input.

[appliance]
# Host layout. Both must be absolute paths to real directories — a separate
# data partition is a mount, not a symlink. After changing either, run
# 'ems-appliance host-config --apply' so the export setup and the export path
# watcher follow.
# The zone the EMS runs its local-hour control windows in. The host itself
# stays on a deterministic UTC, and this is passed into the containers as TZ.
timezone = UTC

install_root = /opt/ems-solarflow
export_root = /srv/ems-appliance-export

# Web interface (unprivileged process).
web_address = 0.0.0.0
web_port = 8088
web_user = ems-appliance-web
socket_group = ems-appliance

# Containers the appliance may inspect and control.
admin_container = ems-solarflow-admin
ems_container = ems-solarflow-api-control
influx_container = ems-influxdb
admin_service = ems-solarflow-admin
ems_service = ems
influx_service = influxdb
admin_port = 8090
# Admin's own unauthenticated status route. A path Admin does not serve would
# answer 404 and fail the health gate of every healthy appliance.
admin_health_path = /api/admin/auth/status

# Host accounts whose authorized_keys the appliance may manage. They are
# created, confined and removed by this package, so the names are fixed and no
# third one is accepted. ems-backup is an SFTP account with no shell.
ssh_key_accounts = ems-backup

# Whether the console may deploy a key onto ems-shell, which has a shell and
# reaches root through sudo. A key there is root on this appliance, so set this
# to no on a box that is administered from a keyboard and should never grow a
# root login from a browser.
#
# A key alone is still not a login either way: the sshd policy refuses that
# account every authentication method until 'ems-appliance shell-access enable'
# or the console switch turns it on.
#
# Stated as its own decision rather than a name left out of the list above,
# because this file is a conffile an upgrade never rewrites: a list written
# before the account existed would otherwise read as a refusal nobody made.
shell_key_deployment = yes

# Owner of the hosted deployment and the uid its containers run as. Created by
# this package; the name is fixed. A deployment root that already has a
# non-root owner keeps it — this account only claims one nothing was ever
# installed in, which is what a freshly flashed appliance has.
deployment_user = ems-deploy

# Sessions.
session_timeout_seconds = 1800
session_absolute_max_seconds = 43200

# Admin replacement.
health_timeout_seconds = 120
supported_architectures = arm64

# Optional JSON release index. Leave it empty and the installable versions are
# read from the registry the Admin image is pulled from, which is the only list
# that answers what can actually be installed. Set it for a mirror or an
# air-gapped site: a configured index replaces the registry rather than adding
# to it. Either way a mutable name such as "latest" is never an installable
# version.
release_index_url =

# Operating-system updates. The OS is patched in place by apt; there is no
# image to install and nothing here decides what apt may fetch.
minimum_free_megabytes = 1024

# Install waiting *security* updates without being asked, once a day at a
# randomised hour. Off by default, because a failed apt run on this appliance
# is recovered by re-flashing and restoring a backup, and that is a decision
# to make deliberately.
#
# Turning it on takes effect at the next run; nothing has to be enabled by
# hand. It goes through the same plan, the same blockers and the same operation
# record as the console: a full upgrade is never installed this way, and a
# reboot the updates ask for is reported and left to you.
automatic_security_updates = false

# The trust anchor for every signed artifact this appliance installs. Root-owned
# and never reachable from a request: an index may name a candidate, and only
# the detached signature over its manifest decides whether it is installed.
release_keyring = /etc/ems-appliance-manager/release-keyring.gpg

# The signer this appliance accepts, on top of that keyring. A keyring can hold
# more keys than a release is allowed to be signed with, so "gpg said good" is
# not the same answer as "signed by us", and the release side has refused to
# finalize without a named fingerprint since it was written.
#
# The PRIMARY, not the signing subkey. gpg reports the primary's fingerprint for
# a subkey signature, which is what makes rotating a leaked subkey cost nothing
# in the field: the primary certifies a new one and no appliance needs a new
# keyring. Empty accepts any key the keyring holds.
release_fingerprints = C5226401689A7AFFDC92D55742B3EB428EC5BD63

# Where signed Appliance Manager packages are downloaded from. The index only
# names candidates. The manager updates only when an
# operator asks it to, and the same control installs an older package as
# readily as a newer one -- going back is the recovery this path provides.
# Empty is a working state: the package can still be installed by hand.
#
# Pinned to one tag rather than the /releases/latest alias, and that is not a
# preference. Two products publish releases from this repository; the alias
# resolves to the newest release that is neither draft nor prerelease, which is
# an EMS release carrying no index. A flashed appliance never gets this value
# corrected -- ems-appliance-config-seed only creates a missing file, and this
# is not a dpkg conffile -- so an alias that can drift is a fleet that can be
# pointed at nothing, permanently.
manager_index_url = https://github.com/basecubedev/ems-solarflow-api-control/releases/download/appliance-manager-index/manager-packages.json

# WLAN changes revert to the previous profile after this many seconds without
# connectivity.
wifi_revert_timeout_seconds = 90
