# EMS SolarFlow Appliance Manager host configuration.
#
# Only root may edit this file. The browser can never widen any set defined
# here: container names, host accounts and supported architectures are host
# authority, not request input.

[appliance]
# Web interface (unprivileged process).
web_address = 0.0.0.0
web_port = 8080
web_user = ems-appliance-web
socket_group = ems-appliance

# Containers the appliance may inspect and control.
admin_container = ems-solarflow-admin
ems_container = ems-solarflow
influx_container = ems-influxdb
admin_service = ems-solarflow-admin
admin_port = 8090
admin_health_path = /api/health

# Host accounts whose authorized_keys the appliance may manage.
backup_user = ems-backup
ssh_key_accounts = ems-backup

# Sessions.
session_timeout_seconds = 1800
session_absolute_max_seconds = 43200

# Admin replacement.
health_timeout_seconds = 120
supported_architectures = arm64

# Optional JSON release index used to resolve the "latest stable" channel.
# Without it the channel reports release_channel_unresolved instead of falling
# back to a mutable tag.
release_index_url =

# Operating-system updates.
minimum_free_megabytes = 1024
automatic_security_updates = false

# WLAN changes revert to the previous profile after this many seconds without
# connectivity.
wifi_revert_timeout_seconds = 90
