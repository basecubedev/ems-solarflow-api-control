// Read by apt-daily.service alone, through APT_CONFIG; see os-updates.md.
// A source that cannot be reached fails the refresh, so apt's daily stamp,
// which the console reads the index's age from, means every source answered.
APT::Periodic::Update-Package-Lists "1";
APT::Update::Error-Mode "any";
