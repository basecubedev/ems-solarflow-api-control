[pytest]
pythonpath = .
testpaths = tests
markers =
    simulation: simulated tests without hardware or network access
    power_control: EMS power/output control tests
    regression: behavior regression tests for release safety
    docker: tests that require a Docker daemon
    mqtt_release: focused Zendure MQTT development-release gate (fast, no hardware)
    system_build: paired/legacy System Build compatibility and Fresh Install gate
