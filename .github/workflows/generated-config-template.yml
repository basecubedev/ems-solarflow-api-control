name: EMS config template

"on":
  pull_request:
    paths:
      - "ems/config_catalog.py"
      - "tools/build_config_template.py"
      - "config/config.template.json"
      - ".github/workflows/generated-config-template.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  update-same-repository-pr:
    name: EMS config template update
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Regenerate config template
        run: python tools/build_config_template.py

      - name: Commit and push updated template
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- config/config.template.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/config.template.json
          git commit -m "chore(config): update generated config template"
          git push origin "HEAD:${HEAD_BRANCH}"

  check-fork-pr:
    name: EMS config template check (fork)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out fork PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check generated config template
        run: |
          if python tools/build_config_template.py --check; then
            exit 0
          fi

          printf '%s\n' \
            "Generated config template is stale." \
            "Run: python tools/build_config_template.py" \
            "Then commit config/config.template.json." >&2
          exit 1

  gate:
    name: EMS config template gate
    # See the note on the gate in simulated-regression-tests.yml. The two jobs
    # above are mutually exclusive -- a fork pull request skips one and a
    # same-repository one skips the other -- so exactly one skip is the normal
    # case here rather than a signal.
    needs:
      - update-same-repository-pr
      - check-fork-pr
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Refuse a run in which anything did not succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c 'import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = sorted((name, outcome["result"]) for name, outcome in results.items()
                       if outcome["result"] not in ("success", "skipped"))
          for name, result in bad:
              print(f"::error::{name} concluded {result}")
          print(f"{len(results) - len(bad)} of {len(results)} jobs succeeded or were skipped")
          sys.exit(1 if bad else 0)'
