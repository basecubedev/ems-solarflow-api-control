name: Nightly full suite

# The pull-request workflow runs partitioned groups and the critical browser
# subsets. This workflow runs everything end to end: both Python versions, both
# browsers in full, Docker-first, System Build and the upgrade/recovery journey.

"on":
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-full:
    name: python-full (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Install the filesystem tools the fixtures build with
        run: sudo apt-get install -y --no-install-recommends mtools e2fsprogs

      - name: Report the selected marker expression
        run: printf 'pytest -q -m "not docker" tests/\n'

      - name: Run full test suite (excludes real-Docker e2e, see docker-first job)
        run: |
          pytest -q -m "not docker" tests/

      - name: Run strict deprecation warning check
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -W error::DeprecationWarning -m pytest -q -m "not docker" tests/

  playwright-full:
    name: playwright-${{ matrix.browser }}-full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run the full Admin suite
        env:
          CI: "1"
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-first:
    name: docker-first
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Report the selected marker expression
        run: printf 'pytest -q -rs -m docker tests/\n'

      - name: Run real-Docker e2e tests
        run: |
          pytest -q -rs -m docker tests/

      - name: Show leftover containers on failure
        if: failure()
        run: |
          docker ps -a
          docker volume ls
          docker network ls

  system-build:
    name: system-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Report the selected marker expression
        run: printf 'pytest -q -m system_build tests/\n'

      - name: Run the System Build tier
        run: |
          pytest -q -m system_build tests/

  upstream-generator:
    name: Pinned rpi-image-gen tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # The upstream-tree tests skip unless something names a real tree, so
      # without this job nothing runs them and the contract the image is built
      # against is bound only by the release gates. No count is stated here: the
      # one that used to be went stale, and a comment that miscounts its own
      # subject is worse than one that does not try.
      #
      # The form is deliberately not pinned. It resolves to a clone wherever git
      # exists, which is every runner, and that is the half of the fetch whose
      # umask went unpinned until 2026-08-27 -- this job is what found it, and
      # naming the other form here would hide it again.
      - name: Fetch the pinned generator tree
        run: |
          scripts/appliance-fetch-rpi-image-gen.sh --into "$RUNNER_TEMP/rpi-image-gen"

      - name: Report the selected tier
        run: printf 'pytest -q -rs tests/test_appliance_rpi_image_gen_upstream.py\n'

      - name: Run the upstream contract tier
        env:
          EMS_RPI_IMAGE_GEN: ${{ runner.temp }}/rpi-image-gen
        run: |
          pytest -q -rs tests/test_appliance_rpi_image_gen_upstream.py


# The Admin replacement and recovery journey is NOT duplicated here. It may only
# run against immutable published digests resolved and verified from the
# Development catalogue, which admin-replacement-canary.yml owns end to end
# (resolve -> verify -> GHCR login -> replace). A second copy here would either
# repeat that resolution logic or run the canary against mutable tags.
# See docs/developer/ci-release.md.
