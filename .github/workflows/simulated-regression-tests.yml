name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: |
          ruff check .

      - name: Compile Python files
        run: |
          python -m compileall admin ems dashboard scripts tests emsctl.py ems-solarflow-api-control.py

      - name: Check generated config template
        run: |
          python tools/build_config_template.py --check

      - name: Check the admin.js frontend parses
        run: |
          node --check admin/static/admin.js

  # The four groups partition the non-Docker suite: `core` is the complement of
  # the functional groups, so an unclassified module still runs exactly once.
  # tests/test_test_classification.py enforces that property.
  python-tests:
    name: python-${{ matrix.group }} (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - admin
          - mqtt
          - power-control
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency imports
        run: |
          python - <<'PY'
          import requests
          import sqlite3
          import urllib3
          import zoneinfo

          print("requests", requests.__version__)
          print("urllib3", urllib3.__version__)
          print("sqlite", sqlite3.sqlite_version)
          print("zoneinfo ok", zoneinfo.ZoneInfo("Europe/Berlin"))
          PY

      # The script prints the selected marker expression and fails when the
      # group unexpectedly collects nothing.
      - name: Run ${{ matrix.group }} group
        run: |
          ./scripts/test-pr.sh ${{ matrix.group }}

      - name: Run Python 3.14 runtime simulation smoke
        if: matrix.python-version == '3.14' && matrix.group == 'core'
        run: |
          python -B ems-solarflow-api-control.py --simulate --max-cycles 2

  simulated-regression-tests:
    name: Simulated power-control regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run simulated regression tests
        run: |
          pytest -q tests/ -m "simulation and power_control"

  system-build-compatibility:
    name: System Build compatibility gate (paired + legacy Fresh Install)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Focused regression gate covering paired/legacy resource strategy, Admin
      # alignment and Continue gating, transition persistence, discovery
      # authorization, resource preparation and Known-Good — including the
      # original v0.7.0 deadlock reproduction.
      - name: Run System Build compatibility gate
        run: |
          pytest -q -m system_build tests/

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build runtime image
        run: |
          docker build -t ems-solarflow-api-control:ci-smoke .

      - name: Verify Python runtime
        run: |
          docker run --rm ems-solarflow-api-control:ci-smoke python --version

      - name: Compile packaged Python files
        run: |
          docker run --rm ems-solarflow-api-control:ci-smoke python -m compileall ems dashboard emsctl.py ems-solarflow-api-control.py

      - name: Run packaged simulation smoke
        run: |
          docker run --rm ems-solarflow-api-control:ci-smoke python -B ems-solarflow-api-control.py --config /app/config/missing-ci-smoke.json --simulate --max-cycles 2

      - name: Verify writable data volume path
        run: |
          docker run --rm ems-solarflow-api-control:ci-smoke python -c "from pathlib import Path; p=Path('/app/data/ci-smoke.txt'); p.write_text('ok'); assert p.read_text() == 'ok'"

      - name: Run Docker Compose first-run smoke
        env:
          EMS_DOCKER_SMOKE_IMAGE: ems-solarflow-api-control:ci-smoke
          EMS_DOCKER_SMOKE_BUILD: "0"
        run: |
          scripts/docker_compose_smoke.sh

  docker-first-e2e:
    name: Docker-first setup e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Real Docker daemon tests only (docker marker): install-docker.sh
      # quickstarts, image-content checks, and update/backup flows. Tests build
      # the image, run the documented Docker flow, print redacted compose logs
      # on failure, and clean up their own project in a finally block. Non-Docker
      # contract/unit tests run in the python-tests groups instead.
      - name: Run real-Docker e2e tests
        run: |
          pytest -q -rs -m docker tests/

      - name: Show leftover containers on failure
        if: failure()
        run: |
          docker ps -a
          docker volume ls
          docker network ls

  influx-e2e:
    name: InfluxDB analytics e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      influxdb:
        image: influxdb:2.7
        ports:
          - 8086:8086
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: ci
          DOCKER_INFLUXDB_INIT_PASSWORD: ci-password-123
          DOCKER_INFLUXDB_INIT_ORG: ems-e2e
          DOCKER_INFLUXDB_INIT_BUCKET: bootstrap
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ci-e2e-token
        options: >-
          --health-cmd "influx ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run InfluxDB-backed analytics e2e
        env:
          EMS_INFLUX_E2E_URL: http://localhost:8086
          EMS_INFLUX_E2E_TOKEN: ci-e2e-token
          EMS_INFLUX_E2E_ORG: ems-e2e
        run: |
          pytest -q -rs tests/test_history_analytics_e2e.py
