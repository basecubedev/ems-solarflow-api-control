name: Repo browser e2e

on:
  pull_request:
    paths:
      - "admin/**"
      - "ems/zendure_mqtt/**"
      - "ems/mqtt_control/**"
      - "ems/config.py"
      - "ems/config_catalog.py"
      - "ems/paths.py"
      - "deploy/admin/**"
      - "tests/e2e/**"
      - "appliance/**"
      - "tests/e2e-appliance/**"
      - "playwright.config.ts"
      - "playwright.appliance.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright-e2e.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests run the tagged critical subsets. The full Chromium and Firefox
  # suites run in the playwright-full job below and in scripts/test-rc.sh.
  playwright-chromium-critical:
    name: Repo browser chromium critical
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the Chromium critical group
        env:
          CI: "1"
        run: npx playwright test --project=chromium --grep "@smoke|@authority"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-critical
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-firefox-smoke:
    name: Repo browser firefox smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps firefox

      - name: Run the Firefox smoke group
        env:
          CI: "1"
        run: npx playwright test --project=firefox --grep "@smoke"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-firefox-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # WebKit is not required per PR: run the smoke group on demand and before a
  # release. Kept separate so a WebKit-only flake never blocks a PR.
  playwright-webkit:
    name: Repo browser webkit pre-release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run Playwright tests (WebKit)
        env:
          CI: "1"
        run: npx playwright test --project=webkit --grep "@smoke"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The Raspberry Pi Appliance Manager UI. Its own config and its own
  # deterministic test server, so it shares nothing with the Admin suite above.
  playwright-appliance:
    name: Repo browser appliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run the appliance manager suite
        env:
          CI: "1"
        run: npx playwright test --config=playwright.appliance.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-appliance
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-full:
    name: Repo browser ${{ matrix.browser }} full
    # After a merge, not in front of one. The two jobs above run the critical
    # and smoke slices so a pull request answers in minutes; this is the same
    # projects with no --grep, which is where a test outside those slices is
    # allowed to cost ten minutes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run the full Admin suite
        env:
          CI: "1"
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gate:
    name: Repo browser gate
    # See the note on the gate in simulated-regression-tests.yml. playwright-webkit
    # is skipped on every pull request by its own `if`, which is why a skip counts
    # as a pass here.
    needs:
      - playwright-chromium-critical
      - playwright-firefox-smoke
      - playwright-webkit
      - playwright-appliance
      - playwright-full
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Refuse a run in which anything did not succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c 'import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = sorted((name, outcome["result"]) for name, outcome in results.items()
                       if outcome["result"] not in ("success", "skipped"))
          for name, result in bad:
              print(f"::error::{name} concluded {result}")
          print(f"{len(results) - len(bad)} of {len(results)} jobs succeeded or were skipped")
          sys.exit(1 if bad else 0)'
